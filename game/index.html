<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Salvage</title>
<meta name="description" content="A salvage tug, five decaying windows, one way out. A small canvas arcade game.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #0b1226 0%, #05060d 62%, #03040a 100%);
    color: #eaf1ff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 8 / 5;
    cursor: crosshair;
    touch-action: none;
    background: #05060d;
    box-shadow: 0 0 90px rgba(28, 52, 112, 0.35) inset;
  }
  #fail {
    position: fixed;
    inset: auto 0 18px 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ff5d6c;
    opacity: 0;
    transition: opacity 200ms linear;
  }
  #fail.on { opacity: 1; }
  noscript { position: fixed; inset: 40% 0 auto 0; text-align: center; font-size: 14px; }
</style>
</head>
<body>
  <main id="wrap">
    <canvas id="stage" width="1280" height="800"
      aria-label="Orbital Salvage: fly a salvage tug, collect fuel cells, clear five windows"></canvas>
  </main>
  <p id="fail">the game script did not load</p>
  <noscript>Orbital Salvage needs JavaScript enabled.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
